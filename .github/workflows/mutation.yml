name: Mutation

# Coverage proves a line ran; mutation testing proves a test would notice if it broke. It is the
# only thing that catches a test which executes code and asserts nothing.
#
# Mutating everything runs the test suite once per mutant, far too slow to sit in front of a PR. So
# a PR mutates only the files it changed and compares them against their own recorded scores, and
# the whole codebase is swept on a schedule instead.

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/js/**'
      - 'tests/**'
  schedule:
    # Sundays, 04:00 UTC. Catches drift that no single change is responsible for. A failure here
    # emails the repo owner; nothing else about a scheduled run reaches anyone.
    - cron: '0 4 * * 0'
  workflow_dispatch:

jobs:
  changed-files:
    name: Changed files must not score worse
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # The ratchet diffs against the base branch, so it needs the history to diff against.
          fetch-depth: 0
          # The PR branch itself rather than the merge ref, because this job pushes the recorded
          # baseline back to it and a detached merge commit has nowhere to push.
          ref: ${{ github.head_ref }}
          # RATCHET_TOKEN is a PAT. A push authenticated with GITHUB_TOKEN does not trigger
          # workflows, so the commit this job makes would carry none of the required checks and
          # leave the PR unmergeable with nothing to re-run.
          token: ${{ secrets.RATCHET_TOKEN || github.token }}

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ratchet
        run: node scripts/mutation-ratchet.mjs check --base origin/${{ github.base_ref }}

      # The ratchet gives any file that had no bar its first one, so new code is never exempt from
      # the gate. Committing that back is what makes the bar outlive the run.
      #
      # This does not loop: the push starts one more round of checks, which finds every file already
      # has a bar, writes nothing, and pushes nothing.
      - name: Commit a bar for any file that had none
        env:
          HAS_TOKEN: ${{ secrets.RATCHET_TOKEN != '' }}
        run: |
          if git diff --quiet mutation-baseline.json; then
            echo "Baseline is complete: every mutated file has a bar."
            exit 0
          fi
          git --no-pager diff mutation-baseline.json
          if [ "$HAS_TOKEN" != "true" ]; then
            echo "::error::A file has no bar, and there is no RATCHET_TOKEN to commit one with."
            echo "Run 'npm run test:mutation:check' locally - it records new files - and commit the result."
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mutation-baseline.json
          git commit -m 'chore: record a mutation bar for files that had none'
          git push origin HEAD:${{ github.head_ref }}

  full-sweep:
    name: Full sweep
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Generous on purpose: this runs the test suite once per mutant, and nothing is waiting on it.
    # The cost of being wrong is losing an hour of work to a kill; the cost of the ceiling being
    # high is nothing, because a hung run still stops here.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          # Recording a missing bar means pushing a branch and opening a PR, which GITHUB_TOKEN
          # could do without triggering that PR's required checks.
          token: ${{ secrets.RATCHET_TOKEN || github.token }}

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The dashboard reporter is added here rather than in stryker.config.mjs so that a local run
      # does not try to publish, and so per-branch runs do not clutter the project's history. It
      # takes project + version from the Actions environment.
      #
      # Concurrency is left to stryker, which reads the machine: n-1 workers, or n when n <= 4.
      # A runner has 4 cores and a dev machine has more, so a number pinned in the config is wrong
      # on both - it oversubscribes one and leaves the other idle.
      - name: Run every mutant
        run: npm run test:mutation -- --reporters dashboard,html,json,clear-text,progress
        env:
          STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}

      # This is the point of the sweep. The per-change check only mutates what a change touched, so
      # a file whose tests were weakened from elsewhere is invisible to it - this compares all of
      # them. Failing is deliberate: a failed scheduled run emails the repo owner, which is the only
      # thing here that actually reaches a person.
      - name: Every file must still hold its score
        run: node scripts/mutation-ratchet.mjs check-all

      # The backstop, for a file that reached main without the per-change path recording it. This
      # job runs ON main, which has enforce_admins set, so nothing can push to it - the recording
      # has to arrive as a PR like any other change.
      - name: Open a PR for any file that reached main with no bar
        env:
          GH_TOKEN: ${{ secrets.RATCHET_TOKEN }}
        run: |
          if git diff --quiet mutation-baseline.json; then
            echo "Baseline is complete: every mutated file has a bar."
            exit 0
          fi
          git --no-pager diff mutation-baseline.json
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::A file reached main with no bar, and there is no RATCHET_TOKEN to record one."
            echo "Download this run's report into reports/mutation/ and commit 'npm run test:mutation:record'."
            exit 1
          fi
          branch="chore/mutation-baseline-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add mutation-baseline.json
          git commit -m 'chore: record a mutation bar for files that had none'
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title 'chore: record a mutation bar for files that had none' \
            --body 'Opened by the weekly sweep: these files were measured with no baseline to compare against, so they were exempt from the ratchet. Recorded at what the sweep measured.' \
            --label 'release:patch'
          gh pr merge "$branch" --rebase --auto

      # Secondary to the dashboard and the run summary; kept for offline digging.
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 30
