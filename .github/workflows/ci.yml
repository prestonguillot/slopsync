name: CI

# Build and run the test suite on every push and PR to main, and on demand.
# Branch protection requires this check to pass before a PR can merge.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: # allow manual trigger via the Actions UI

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check & build
        run: npm run build

      # The build's tsconfig only covers src/. Tests went unchecked for the life of the repo, which
      # is how fixtures came to assert error shapes the client cannot throw, and how 64 tests that
      # never imported the app survived. vitest transpiles without typechecking, so this is the
      # only thing that looks.
      - name: Type-check tests
        run: npm run type-check:tests

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # Re-vendor the self-hosted frontend libs (htmx, Bootstrap, htmx-ext-sse) from
      # node_modules and fail if the committed files in public/vendor are stale. This
      # forces a Dependabot bump of those packages to be followed by `npm run vendor`.
      - name: Vendored assets up to date
        run: |
          npm run vendor
          git diff --exit-code public/vendor

      # Unit + mocked-integration suite. Excludes the live Spotify/YouTube tests
      # (tests/live, opt-in via test:spotify:live) and the visual-regression tests
      # (tests/visual, local-only) - neither runs here.
      - name: Run tests
        run: npm run test:run
